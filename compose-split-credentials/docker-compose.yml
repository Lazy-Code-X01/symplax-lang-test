# Credentials split across separate variables instead of one URL.
#
# This is the shape a host-only rewrite gets wrong. DB_HOST is swapped to the
# provisioned database while DB_USER, DB_PASSWORD and DB_NAME keep the values
# written here, which describe a container Symplax never creates, so the app
# reaches the right server and is refused by it.
#
# The app connects for real and its health check fails if any one of the four
# is wrong, so a deploy that goes green is the proof.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_NAME: appdb
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
